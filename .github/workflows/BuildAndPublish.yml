name: BuildAndPack
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be an unprefixed SemVer version, such as 1.2.3 or 1.2.3-preview.1" >&2
            exit 1
          fi

      - name: dotnet pack
        run: dotnet pack

      - name: upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: read
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/package/release

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: akkeluukkonen

      - name: push to NuGet
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/package/release/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in artifacts/package/release" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json
          done
